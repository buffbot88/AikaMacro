name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release
        env:
          CARGO_TERM_COLOR: always

      - name: Prepare unsigned artifact
        shell: pwsh
        run: Copy-Item target\release\aikatk_macro.exe AikaTK-Macro-unsigned.exe

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AikaTK-Macro-unsigned
          path: AikaTK-Macro-unsigned.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'aikatk-macro'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'aikatk-macro-exe'
          github-artifact-id: '${{ steps.upload.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'
          parameters: |
            GitHubRepositoryUrl: "${{ github.server_url }}/${{ github.repository }}"
            GithubWorkflowRunId: "${{ github.run_id }}"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: AikaTK-Macro-signed
          path: signed/AikaTK-Macro.exe
          if-no-files-found: error

      - name: Attach signed exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/AikaTK-Macro.exe
