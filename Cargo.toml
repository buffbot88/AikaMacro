[package]
name = "aikatk_macro"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
winres = "0.1"
