[package]
name = "osk-typer"
version = "0.1.0"
edition = "2021"
description = "Automatically click Windows On-Screen Keyboard buttons to type into Notepad"
license = "MIT"

[dependencies]
anyhow = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
